name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff pytest
      - run: ruff check --no-cache --select E9,F63,F7,F82,F821 --output-format concise .
      - run: python -m pytest -q --tb=short -p no:cacheprovider -rfE --no-header
      - name: README run commands
        run: |
          awk '/scio:run-end/{f=0} f && !/^```/; /scio:run -->/{f=1}' README.md > readme-run.sh
          bash -e readme-run.sh
